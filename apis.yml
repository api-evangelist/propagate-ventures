name: Propagate Ventures
description: >-
  Propagate (formerly Propagate Ventures) is a regenerative-agriculture company
  founded in 2017 that helps farmland owners, farmers, and investors design,
  plant, finance, and manage agroforestry and tree-crop systems. Its flagship
  SaaS product, Overyield, lets farmers, developers, and investors model tree-crop
  economics, choose crops, and design tree-crop systems that work alongside
  existing farm operations. Propagate pairs the software with technical
  assessments, site prep and planting services, improved tree genetics, and
  ongoing project monitoring, and is a partner in the USDA Partnerships for
  Climate-Smart Commodities. The company advises 30,000+ acres of agroforestry
  supporting over 760,000 trees and shrubs. Propagate publishes no public API or
  developer platform at this time.
